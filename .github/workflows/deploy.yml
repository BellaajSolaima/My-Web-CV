on:
  push:
    branches:
      - main  # Déclencher l'action lorsqu'un commit est poussé sur main
      - main  # Exécuter l’action lors d’un push sur la branche main

permissions:
  contents: read
  pages: write
  id-token: write  # Autorise l'accès à GitHub Pages


jobs:
  deploy:
    runs-on: ubuntu-latest  # Utilise une machine Linux
    

    steps:
      - name: Checkout du code
        uses: actions/checkout@v3  # Récupère le code du dépôt
        

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v3  # Configure GitHub Pages

     
      - name: Upload des fichiers (correctif)
        uses: actions/upload-pages-artifact@v2  # ✅ Correctif : Compatible GitHub Pages
        with:
          name: github-pages  # Nom de l’artefact
          path: .  # Tous les fichiers HTML/CSS/JS du projet seront pris en compte

      - name: Déployer sur GitHub Pages
        uses: actions/deploy-pages@v1  # Déploie les fichiers sur GitHub Pages
