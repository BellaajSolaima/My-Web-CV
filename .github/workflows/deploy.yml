name: Deploy Static Website to GitHub Pages

on:
  push:
    branches:
      - main  # Exécuter l’action lors d’un push sur `main`

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest  # Exécuter sur une machine Linux

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v3  # Récupère le code source

      - name: ⚙️ Setup GitHub Pages
        uses: actions/configure-pages@v3  # Configure GitHub Pages

      - name: 📤 Upload des fichiers pour GitHub Pages
        uses: actions/upload-pages-artifact@v2  # ✅ Version correcte pour GitHub Pages
        with:
          path: .  # ✅ Assure-toi que ce dossier contient bien tes fichiers HTML/CSS/JS
          name: github-pages  # ✅ Nom de l’artefact défini

      - name: 🚀 Déployer sur GitHub Pages
        uses: actions/deploy-pages@v1  # Déploie les fichiers sur GitHub Pages
        with:
          artifact_name: github-pages  # ✅ Assure-toi que le bon artefact est utilisé
