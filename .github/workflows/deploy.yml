name: Deploy Static Website to GitHub Pages

on:
  push:
    branches:
      - main  # Exécuter le workflow à chaque push sur main

permissions:
  contents: read
  pages: write
  id-token: write  # Autoriser GitHub Actions à déployer sur GitHub Pages

jobs:
  deploy:
    runs-on: ubuntu-latest  # Utilise Ubuntu comme environnement

    steps:
      - name: Checkout du code
        uses: actions/checkout@v3  # Récupère le code du dépôt

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v3  # Configure GitHub Pages

      - name: Upload des fichiers
        uses: actions/upload-pages-artifact@v4  # ✅ Nouvelle version (corrigée)
        with:
          path: .  # Prend tous les fichiers HTML/CSS/JS

      - name: Déployer sur GitHub Pages
        uses: actions/deploy-pages@v1  # Déploie les fichiers sur GitHub Pages

