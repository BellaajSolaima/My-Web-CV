name: Deploy Static Website to GitHub Pages

on:
  push:
    branches:
      - main  # Déclencher l'action lorsqu'un commit est poussé sur `main`

permissions:
  contents: read
  pages: write
  id-token: write  # Autoriser GitHub Pages à écrire

jobs:
  deploy:
    runs-on: ubuntu-latest  # Exécute le workflow sur une machine Linux

    steps:
      - name: Checkout du code
        uses: actions/checkout@v3  # Récupère le code du dépôt

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v3  # Configure GitHub Pages

      - name: Upload des fichiers
        uses: actions/upload-pages-artifact@v2  # ✅ Version supportée
        with:
          path: .  # Tous les fichiers du projet HTML/CSS/JS seront pris

      - name: Déployer sur GitHub Pages
        uses: actions/deploy-pages@v1  # Déploie sur GitHub Pages

